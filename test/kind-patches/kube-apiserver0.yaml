apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver-kind-control-plane
  namespace: kube-system
spec:
  volumes:
    - name: kms
      emptyDir: {}
    - name: encryptionconfig
      hostPath:
        path: /var/encryptionconfig
    - name: stackit-credentials
      hostPath:
        path: /.stackit
  containers:
  - name: kube-apiserver
    volumeMounts:
      - mountPath: /var/run/kmsplugin
        name: kms
      - mountPath: /var/encryptionconfig
        name: encryptionconfig
  - name: kmsplugin
    image: "ko.local/stackitcloud/kubernetes-kms-plugin"
    imagePullPolicy: Never
    args:
    # Adjust projectID, keyRingID, keyID and version here
    #- "-key=projectID/keyRingID/keyID/version"
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    env:
       - name: STACKIT_SERVICE_ACCOUNT_KEY_PATH
         value: "/root/.stackit/credentials.json"
    volumeMounts:
      - mountPath: /var/run/kmsplugin
        name: kms
      - mountPath: /root/.stackit
        name: stackit-credentials
